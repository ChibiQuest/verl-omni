name: npu_smoke

on:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "verl_omni/**"
      - "tests/npu_smoke/**"
      - "tests/workers/**"
      - "tests/special_e2e/**"
      - "pyproject.toml"
      - ".github/workflows/npu_smoke.yml"
      - ".github/actions/npu-smoke-prepare/**"
      - ".github/actions/npu-smoke-upload-logs/**"
      - .github/vllm_omni_pin.txt
  pull_request:
    branches:
      - main
      - v0.*
    types: [labeled]
    paths:
      - "verl_omni/**"
      - "tests/npu_smoke/**"
      - "tests/workers/**"
      - "tests/special_e2e/**"
      - "pyproject.toml"
      - ".github/workflows/npu_smoke.yml"
      - ".github/actions/npu-smoke-prepare/**"
      - ".github/actions/npu-smoke-upload-logs/**"
      - .github/vllm_omni_pin.txt

# Declare permissions just read content and PR file metadata.
permissions:
  contents: read
  pull-requests: read

jobs:
  setup_runner:
    # Pull requests run only after a CI label is applied:
    #   ready-for-ci                    -> all NPU tests as part of full PR validation
    #   ci-npu                         -> all NPU tests for targeted NPU validation
    #   ci-npu-core                   -> core group
    #   ci-npu-e2e                    -> e2e group
    # Pushes to main and release branches run the full suite.
    if: >-
      github.repository_owner == 'verl-project' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'ready-for-ci') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu-core') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu-e2e'))
    runs-on: linux-aarch64-a2b4-8
    timeout-minutes: 120
    container:
      image: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-verl-omni-a2:v010-vllm030-omni030
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve NPU CI groups
        id: resolve-groups
        shell: bash
        run: |
          declare -A label_groups=(
            ["ready-for-ci"]="core e2e"
            ["ci-npu"]="core e2e"
            ["ci-npu-core"]="core"
            ["ci-npu-e2e"]="e2e"
          )
          declare -A selected_groups=()

          pr_labels="${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            labels=("ci-npu")
          else
            IFS=',' read -ra labels <<< "${pr_labels}"
          fi

          for label in "${labels[@]}"; do
            for group in ${label_groups[${label}]:-}; do
              selected_groups["${group}"]=1
            done
          done

          groups=""
          for group in core e2e; do
            if [[ -n "${selected_groups[${group}]:-}" ]]; then
              groups+="${groups:+ }${group}"
            fi
          done
          echo "groups=${groups}" >> "$GITHUB_OUTPUT"
      - name: Prepare NPU smoke job
        if: steps.resolve-groups.outputs.groups != ''
        uses: ./.github/actions/npu-smoke-prepare
      - name: Prepare tiny Qwen-Image checkpoint
        if: contains(steps.resolve-groups.outputs.groups, 'e2e')
        shell: bash
        run: |
          MODEL_PATH="${HOME}/.cache/modelscope/hub/models/tiny-random/Qwen-Image"
          if [[ -d "${MODEL_PATH}" ]]; then
            echo "Reusing existing tiny Qwen-Image checkpoint at ${MODEL_PATH}"
          else
            python tests/special_e2e/build_qwen_image_tiny_random.py --output-dir "${MODEL_PATH}"
          fi
      - name: Prepare and validate tiny Wan2.2 checkpoint
        if: contains(steps.resolve-groups.outputs.groups, 'e2e')
        shell: bash
        run: |
          MODEL_PATH="${HOME}/.cache/models/tiny-random/Wan2.2-TI2V-5B-Diffusers"
          python tests/special_e2e/build_wan22_tiny_random.py \
            --output-dir "${MODEL_PATH}" \
            --verify-load

      - name: Run NPU smoke tests
        if: steps.resolve-groups.outputs.groups != ''
        shell: bash
        run: |
          mkdir -p logs/npu_smoke/parallel
          failed=0
          for group in ${{ steps.resolve-groups.outputs.groups }}; do
            script="tests/npu_smoke/run_npu_smoke_${group}.sh"
            echo "Running NPU smoke group '${group}' with ${script}"
            set +e
            bash "${script}" --num-npus 8 2>&1 | tee "logs/npu_smoke/parallel/${group}.log"
            rc="${PIPESTATUS[0]}"
            set -e
            if [[ "${rc}" -ne 0 ]]; then
              failed=1
            fi
          done
          exit "${failed}"
      - name: Upload NPU smoke logs
        if: always() && steps.resolve-groups.outputs.groups != ''
        uses: ./.github/actions/npu-smoke-upload-logs
